[package]
name = "rtdlib"
version = "1.8.69"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "TDLib for rust"
homepage = "https://github.com/fewensa/rtdlib"
repository = "https://github.com/fewensa/rtdlib"
license = "MIT"
keywords = ["tdlib", "telegram"]
categories = ["data-structures"]
include = [
  "Cargo.toml",
  "build.rs",
  "src/**/*.rs",
  "tests/**/*.rs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]
readme = "README.md"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde-aux = "4.7.0"

uuid = { version = "1.29.0", features = ["v4"] }

rtdlib-sys = { version = "0.1.0", optional = true }

[features]
default = []
sys = ["rtdlib-sys"]
